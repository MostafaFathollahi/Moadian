[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moadian"
version = "0.1.0"
description = "Framework for issuing electronic invoices to Iran's سامانه مودیان (Moadian tax system)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moadian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real tax sandbox over the network (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
