#   when     names an evaluable condition. Fields جدول ۱ marks conditional
#            without the §8 tables naming a trigger carry "unspecified", and the
#            engine leaves those alone rather than inventing one.
#   excluded lists fields that are not part of the pattern at all. Sending one is
#            a structural error — RC_IITP §4: صورتحساب‌های الکترونیکی صرفا شامل
#            اقلام مذکور بوده و اقلام دیگری را شامل نمی‌شود.

