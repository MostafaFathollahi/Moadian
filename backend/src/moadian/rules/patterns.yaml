# Enumerations the engine range-checks. Values come from the §8 tables, not guesses.
enums:
  inty:
    reference: "§3"
    values: [1, 2, 3]
    message: نوع صورتحساب باید یک، دو یا سه باشد.
  ins:
    reference: "§5"
    values: [1, 2, 3, 4]
    message: موضوع صورتحساب باید اصلی، اصلاحی، ابطالی یا برگشت از فروش باشد.
  setm:
    reference: "§8-22، جدول ۲۴، ردیف ۱"
    values: [1, 2, 3]
    message: روش تسویه باید نقدی (۱)، نسیه (۲) یا نقدی/نسیه (۳) باشد.
  tob:
    reference: "§8-9"
    values: [1, 2, 3, 4, 5]
    message: نوع شخص خریدار خارج از مقادیر مجاز است.
  insr:
    reference: "§6"
    values: [1]
    message: قاعده ارسال صورتحساب تنها می‌تواند برابر یک باشد.
