# rather than in code; the money formulas do not, because several have
# pattern-specific inputs (see rules/arithmetic.py for why).
#
# The block below is GENERATED. Regenerate with
#   /opt/homebrew/bin/python3.14 backend/tools/extract_table1.py --check
# which also verifies the transcription against ten independent anchors taken
# from the §8 per-field tables. Hand edits will be lost.
#
# Obligations: required | optional | conditional
#   by_type  overrides the obligation for a نوع صورتحساب; a field can be اجباری
